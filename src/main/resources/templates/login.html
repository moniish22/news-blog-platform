<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="auth-card">
  <h1 class="h3 mb-3">Log in</h1>
  <div class="alert alert-danger" th:if="${param.error}">Wrong email or password, or the account is disabled.</div>
  <div class="alert alert-success" th:if="${param.logout}">You are logged out.</div>
  <form th:action="@{/login}" method="post">
    <div class="mb-3"><label for="username" class="form-label">Email</label><input id="username" name="username" type="email" class="form-control" required autofocus></div>
    <div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" name="password" type="password" class="form-control" required></div>
    <button class="btn btn-signal w-100" type="submit">Log in</button>
  </form>
  <p class="mt-3 mb-0 small"><a th:href="@{/forgot-password}">Forgot your password?</a> · <a th:href="@{/register}">Create an account</a></p>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
