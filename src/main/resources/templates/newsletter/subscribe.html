<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Newsletter')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="auth-card">
  <h1 class="h3">Subscribe to the newsletter</h1>
  <p class="text-soft">We send an email when new articles are published. After you subscribe we email a link to confirm your address.</p>
  <form th:action="@{/newsletter/subscribe}" method="post" class="newsletter-form" novalidate>
    <label for="email" class="form-label">Email address</label>
    <input id="email" name="email" type="email" class="form-control mb-1" required>
    <div class="invalid-feedback">Enter a valid email address.</div>
    <button class="btn btn-signal w-100 mt-3" type="submit">Subscribe</button>
  </form>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
