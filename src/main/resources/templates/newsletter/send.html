<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Send newsletter')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<h1 class="mb-1">Send a newsletter</h1>
<p class="text-soft mb-4" th:text="${'It will be emailed to ' + recipients + ' confirmed, active subscribers.'}">Recipients</p>
<form th:action="@{/newsletter/send}" th:object="${newsletterDto}" method="post" data-confirm="Send this newsletter to all active subscribers now?" novalidate>
  <div class="mb-3"><label for="subject" class="form-label">Subject</label><input id="subject" th:field="*{subject}" class="form-control" th:errorclass="is-invalid" maxlength="200"><div class="invalid-feedback" th:errors="*{subject}">Error</div></div>
  <div class="mb-3"><label for="content" class="form-label">Message</label><textarea id="content" th:field="*{content}" class="form-control" rows="12"></textarea><div class="text-danger small" th:errors="*{content}">Error</div></div>
  <button class="btn btn-signal" type="submit">Send newsletter</button>
  <a class="btn btn-outline-ink ms-2" th:href="@{/newsletter/manage}">Cancel</a>
</form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>
<script>$(function(){ $('#content').summernote({height: 320}); });</script>
</body>
</html>
