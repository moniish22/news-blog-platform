<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Manage users')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<h1 class="mb-4">Users</h1>
<div class="table-responsive">
<table class="table bg-white align-middle">
  <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Account</th><th class="text-end">Actions</th></tr></thead>
  <tbody>
    <tr th:each="u : ${users}">
      <td th:text="${u.name}">Name</td><td th:text="${u.email}">email</td>
      <td>
        <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" class="d-flex gap-1">
          <select name="role" class="form-select form-select-sm" th:attr="aria-label='Role for ' + ${u.name}">
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}">ROLE</option>
          </select>
          <button class="btn btn-sm btn-outline-ink" type="submit">Save</button>
        </form>
      </td>
      <td><span class="badge" th:classappend="${u.enabled ? 'bg-success' : 'bg-secondary'}" th:text="${u.enabled ? 'Active' : 'Disabled'}">Active</span></td>
      <td class="text-end">
        <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post"><button class="btn btn-sm btn-outline-secondary" type="submit" th:text="${u.enabled ? 'Disable' : 'Enable'}">Toggle</button></form>
      </td>
    </tr>
  </tbody>
</table>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
