<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Analytics')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
  <h1 class="mb-0">Analytics</h1>
  <a class="btn btn-outline-ink" th:href="@{/admin/analytics/export}">Download CSV</a>
</div>
<div class="row g-3 mb-4">
  <div class="col-6 col-lg-3"><div class="stat-card"><div class="meta">Total views</div><div class="num" th:text="${stats['totalViews']}">0</div></div></div><div class="col-6 col-lg-3"><div class="stat-card"><div class="meta">Views today</div><div class="num" th:text="${stats['viewsToday']}">0</div></div></div><div class="col-6 col-lg-3"><div class="stat-card"><div class="meta">Published articles</div><div class="num" th:text="${stats['publishedArticles']}">0</div></div></div><div class="col-6 col-lg-3"><div class="stat-card"><div class="meta">Comments</div><div class="num" th:text="${stats['totalComments']}">0</div></div></div>
</div>
<div class="row g-5">
  <div class="col-lg-6">
    <h2 class="h4">Views, last 14 days</h2>
    <div class="bars">
      <div class="bar-row" th:each="e : ${viewsByDay}">
        <span th:text="${e.key}">Day</span>
        <div class="bar-track"><div class="bar-fill" th:style="${'width:' + (maxViews == 0 ? 0 : e.value * 100 / maxViews) + '%'}"></div></div>
        <span th:text="${e.value}">0</span>
      </div>
    </div>
  </div>
  <div class="col-lg-6">
    <h2 class="h4">Published articles per category</h2>
    <div class="bars">
      <div class="bar-row" th:each="e : ${byCategory}" style="grid-template-columns:120px 1fr 30px">
        <span th:text="${e.key}">Cat</span>
        <div class="bar-track"><div class="bar-fill" th:style="${'width:' + (e.value * 100 / (stats['publishedArticles'] == 0 ? 1 : stats['publishedArticles'])) + '%'}"></div></div>
        <span th:text="${e.value}">0</span>
      </div>
    </div>
  </div>
</div>
<h2 class="h4 mt-5">Top articles</h2>
<div class="table-responsive">
<table class="table bg-white">
  <thead><tr><th>Article</th><th class="text-end">Views</th><th class="text-end">Unique</th><th class="text-end">Shares</th><th class="text-end">Avg read (s)</th><th class="text-end">Bounce %</th></tr></thead>
  <tbody>
    <tr th:each="an : ${top}">
      <td><a th:href="@{/article/{s}(s=${an.article.slug})}" th:text="${an.article.title}">Title</a></td>
      <td class="text-end" th:text="${an.views}">0</td><td class="text-end" th:text="${an.uniqueViews}">0</td><td class="text-end" th:text="${an.shares}">0</td>
      <td class="text-end" th:text="${#numbers.formatDecimal(an.avgReadTime, 1, 0)}">0</td><td class="text-end" th:text="${#numbers.formatDecimal(an.bounceRate, 1, 1)}">0</td>
    </tr>
  </tbody>
</table>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
