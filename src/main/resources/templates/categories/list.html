<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<h1 class="mb-4">Categories</h1>
<div class="row g-4">
  <div class="col-md-6 col-lg-4" th:each="c : ${categories}">
    <div class="side-box h-100">
      <h2 class="h4"><a th:href="@{/category/{s}(s=${c.slug})}" th:text="${c.name}">Name</a></h2>
      <p class="text-soft" th:text="${c.description != null ? c.description : 'No description yet.'}">Description</p>
      <div class="d-flex justify-content-between align-items-center">
        <span class="meta" th:text="${c.articleCount + ' published'}">0 published</span>
        <form sec:authorize="hasAnyRole('ADMIN','EDITOR')" th:action="@{/categories/{id}/delete(id=${c.id})}" method="post" data-confirm="Delete this category?">
          <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
<form sec:authorize="hasAnyRole('ADMIN','EDITOR')" th:action="@{/categories}" th:object="${categoryDto}" method="post" class="side-box mt-5 row g-2">
  <h2 class="h5">Add a category</h2>
  <div class="col-md-4"><input type="text" th:field="*{name}" class="form-control" placeholder="Name" aria-label="Name" required maxlength="100"></div>
  <div class="col-md-6"><input type="text" th:field="*{description}" class="form-control" placeholder="Short description" aria-label="Description" maxlength="500"></div>
  <div class="col-md-2 d-grid"><button class="btn btn-signal" type="submit">Add category</button></div>
</form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
