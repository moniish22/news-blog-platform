<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My comments')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<h1 class="mb-4">My comments</h1>
<div class="list-group mb-3">
  <div class="list-group-item" th:each="c : ${page.content}">
    <div class="d-flex justify-content-between">
      <a th:href="@{/article/{s}(s=${c.article.slug})}" th:text="${c.article.title}">Article</a>
      <span class="badge" th:classappend="${c.status.name() == 'APPROVED' ? 'bg-success' : (c.status.name() == 'PENDING' ? 'bg-warning' : 'bg-secondary')}" th:text="${c.status}">Status</span>
    </div>
    <p class="mb-1" th:text="${c.comment}">Text</p>
    <span class="meta" th:text="${@dateUtils.formatDateTime(c.createdAt)}">Date</span>
  </div>
</div>
<p class="text-soft" th:if="${page.empty}">You have not commented yet.</p>
<nav th:replace="~{fragments/layout :: pager(${page}, ${pageUrl})}"></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
