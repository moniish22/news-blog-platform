<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${author.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="d-flex gap-4 align-items-center mb-4 flex-wrap">
  <span class="avatar lg" th:text="${@textUtils.initials(author.name)}">AB</span>
  <div>
    <h1 class="mb-1" th:text="${author.name}">Name</h1>
    <span class="badge bg-dark" th:text="${author.role}">ROLE</span>
    <p class="mt-2 mb-0 text-soft" th:text="${author.bio != null ? author.bio : 'This writer has not added a bio yet.'}">Bio</p>
  </div>
  <a th:if="${currentUser != null and currentUser.id == author.id}" class="btn btn-outline-ink ms-md-auto" th:href="@{/profile/edit}">Edit profile</a>
</div>
<h2 class="section-title">Articles</h2>
<div class="row g-4">
  <div class="col-md-6" th:each="a : ${page.content}"><div th:replace="~{fragments/layout :: articleCard(${a})}"></div></div>
</div>
<p class="text-soft" th:if="${page.empty}">No published articles yet.</p>
<nav th:replace="~{fragments/layout :: pager(${page}, ${pageUrl})}"></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
