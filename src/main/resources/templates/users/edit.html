<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edit profile')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="auth-card" style="max-width:560px">
  <h1 class="h3 mb-3">Edit profile</h1>
  <form th:action="@{/profile/edit}" method="post">
    <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" class="form-control" th:value="${currentUser.email}" disabled></div>
    <div class="mb-3"><label class="form-label" for="name">Name</label><input id="name" name="name" class="form-control" th:value="${currentUser.name}" maxlength="100" required></div>
    <div class="mb-3"><label class="form-label" for="bio">Bio</label><textarea id="bio" name="bio" class="form-control" rows="4" maxlength="1000" th:text="${currentUser.bio}"></textarea></div>
    <div class="mb-3"><label class="form-label" for="avatar">Avatar URL</label><input id="avatar" name="avatar" type="url" class="form-control" th:value="${currentUser.avatar}" placeholder="https://..."></div>
    <button class="btn btn-signal" type="submit">Save profile</button>
  </form>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
