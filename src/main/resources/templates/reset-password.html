<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Choose a new password')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="auth-card">
  <h1 class="h3 mb-3">Choose a new password</h1>
  <div th:if="${!valid}"><p>This reset link is invalid or has expired.</p><a th:href="@{/forgot-password}">Request a new link</a></div>
  <form th:if="${valid}" th:action="@{/reset-password}" method="post">
    <input type="hidden" name="token" th:value="${token}">
    <div class="mb-3"><label for="password" class="form-label">New password (min 6 characters)</label><input id="password" name="password" type="password" class="form-control" minlength="6" required></div>
    <button class="btn btn-signal w-100" type="submit">Update password</button>
  </form>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
