<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="auth-card">
  <h1 class="h3 mb-3">Create your account</h1>
  <form th:action="@{/register}" th:object="${userDto}" method="post" novalidate>
    <div class="mb-3"><label for="name" class="form-label">Name</label><input id="name" th:field="*{name}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{name}">Error</div></div>
    <div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{email}">Error</div></div>
    <div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{password}">Error</div></div>
    <button class="btn btn-signal w-100" type="submit">Create account</button>
  </form>
  <p class="mt-3 mb-0 small">Already registered? <a th:href="@{/login}">Log in</a></p>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
