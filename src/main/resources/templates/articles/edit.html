<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edit article')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<h1 class="mb-1">Edit article</h1>
<p class="text-soft mb-4"><a th:href="@{/article/{s}(s=${article.slug})}" th:text="${'View ' + article.title}">View</a></p>
<div th:replace="~{articles/form :: form}"></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>
<script>$(function(){ $('#content').summernote({height: 340, placeholder: 'Write your story...'}); });</script>
</body>
</html>
