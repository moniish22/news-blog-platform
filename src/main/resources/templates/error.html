<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="text-center py-5">
  <h1 th:text="${status == 404 ? 'Page not found' : (status == 403 ? 'No access' : 'Something went wrong')}">Error</h1>
  <p class="text-soft" th:text="${status == 404 ? 'That page does not exist or has been unpublished.' : (status == 403 ? 'Your account does not have permission to open this page.' : 'Please try again in a moment.')}">Message</p>
  <a class="btn btn-signal" th:href="@{/}">Back to the home page</a>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
