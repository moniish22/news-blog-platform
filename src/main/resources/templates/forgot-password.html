<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Forgot password')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="auth-card">
  <h1 class="h3 mb-3">Reset your password</h1>
  <p class="text-soft">Enter your email and we will send a reset link that works for one hour.</p>
  <form th:action="@{/forgot-password}" method="post">
    <div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" name="email" type="email" class="form-control" required></div>
    <button class="btn btn-signal w-100" type="submit">Send reset link</button>
  </form>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
