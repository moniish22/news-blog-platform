<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My dashboard')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
  <h1 class="mb-0">My dashboard</h1>
  <a class="btn btn-signal" th:href="@{/author/articles/new}">Write an article</a>
</div>
<div class="row g-3 mb-4">
  <div class="col-md-4"><div class="stat-card"><div class="meta">My articles</div><div class="num" th:text="${stats['articles']}">0</div></div></div>
  <div class="col-md-4"><div class="stat-card"><div class="meta">Total views</div><div class="num" th:text="${stats['views']}">0</div></div></div>
  <div class="col-md-4"><div class="stat-card"><div class="meta">Comments on my articles</div><div class="num" th:text="${stats['comments']}">0</div></div></div>
</div>
<div th:replace="~{fragments/layout :: articleTable(${page.content}, false)}"></div>
<nav th:replace="~{fragments/layout :: pager(${page}, ${pageUrl})}"></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
