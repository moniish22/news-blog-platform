<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Editor dashboard')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
  <h1 class="mb-0">Editor dashboard</h1>
  <div class="d-flex gap-2"><a class="btn btn-signal" th:href="@{/author/articles/new}">New article</a>
  <a class="btn btn-outline-ink" th:href="@{/moderation/comments}">Moderate comments</a></div>
</div>
<div class="row g-3 mb-4">
  <div class="col-6 col-lg-3"><div class="stat-card warn"><div class="meta">Pending review</div><div class="num" th:text="${stats['pendingArticles']}">0</div></div></div><div class="col-6 col-lg-3"><div class="stat-card"><div class="meta">Scheduled</div><div class="num" th:text="${stats['scheduledArticles']}">0</div></div></div><div class="col-6 col-lg-3"><div class="stat-card"><div class="meta">Published</div><div class="num" th:text="${stats['publishedArticles']}">0</div></div></div><div class="col-6 col-lg-3"><div class="stat-card warn"><div class="meta">Comments awaiting approval</div><div class="num" th:text="${stats['pendingComments']}">0</div></div></div>
</div>
<h2 class="h4">Review queue</h2>
<div th:replace="~{fragments/layout :: articleTable(${reviewQueue}, true)}"></div>
<h2 class="h4 mt-4">All articles</h2>
<div th:replace="~{fragments/layout :: articleTable(${page.content}, true)}"></div>
<nav th:replace="~{fragments/layout :: pager(${page}, ${pageUrl})}"></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
