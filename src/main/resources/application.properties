spring.application.name=newsblog
server.port=8080

# ---- Database (override with env vars DB_URL / DB_USERNAME / DB_PASSWORD) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/newsblog_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate (dialect is auto-detected) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- Email (Gmail needs an App Password; keep secrets in env vars, never in Git) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---- Application settings ----
app.newsblog.articles-per-page=10
app.newsblog.comments-per-page=20
app.newsblog.base-url=${BASE_URL:http://localhost:8080}
app.newsblog.newsletter.from-email=${MAIL_FROM:noreply@newsblog.com}
app.newsblog.newsletter.verification-required=true
app.newsblog.newsletter.notify-on-publish=true
app.newsblog.comments.auto-approve-readers=false
app.newsblog.seed-data=true
